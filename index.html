<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    
    <!-- TAGS ANTI-CACHE (Dizem para o celular sempre baixar a versão nova) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maquinadle</title>
    <style>
        /* O resto do código continua igual daqui pra baixo... */
        :root {
            --bg: #121213; --bg-card: #1e1e1e; --bg-row: #1a1a1b; --text: #ffffff;
            --gold: #fbc02d; --gold-hover: #f9a825; --border: #333;
            --green: #4caf50; --red: #f44336; --orange: #ff9800; --yellow: #ffeb3b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 15px; display: flex; justify-content: center;
        }
        .container { max-width: 450px; width: 100%; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; font-weight: 800; }
        .header h1 span { color: var(--gold); }
        .stats-icons { display: flex; gap: 10px; color: #888; font-size: 1.2rem; }
        
        /* Machine Card */
        .card { background-color: var(--bg-card); border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .brand { font-size: 0.8rem; font-weight: bold; color: var(--orange); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .model { font-size: 1.3rem; font-weight: bold; margin: 0; }
        .detail { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 3px; }
        .year-box { text-align: right; }
        .year-label { font-size: 0.7rem; color: #888; font-weight: bold; letter-spacing: 1px; }
        .year-val { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin: 0; }
        .img-container { width: 100%; border-radius: 6px; overflow: hidden; background: #000; display: flex; justify-content: center; }
        .img-container img { width: 100%; height: auto; display: block; }
        
        /* Guesses Area */
        .guesses { display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-row); padding: 12px 15px; border-radius: 6px; border: 1px solid var(--border); height: 30px; font-weight: bold;}
        .row.active { border-color: var(--gold); box-shadow: 0 0 5px rgba(251, 192, 45, 0.2); }
        .row-num { color: #666; font-size: 0.9rem; width: 30px; }
        
        /* Active Input Form */
        .input-wrapper { display: flex; flex: 1; align-items: center; justify-content: space-between; }
        .input-prefix { color: #888; margin-right: 5px; }
        .guess-input {
            background: transparent; border: none; color: white; font-size: 1.1rem; font-weight: bold; width: 100%; outline: none;
        }
        .submit-btn {
            background: var(--gold); color: #000; border: none; border-radius: 4px; width: 40px; height: 35px;
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .submit-btn:active { background: var(--gold-hover); }

        /* Filled Row (Past Guess) */
        .row-val { font-size: 1.1rem; color: white; flex: 1; text-align: left; margin-left: 10px; }
        .row-hint { font-size: 0.85rem; border-radius: 4px; padding: 4px 10px; border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
        
        /* Hint Colors */
        .c-red { color: #ffbaba; border-color: var(--red); background: rgba(244, 67, 54, 0.2); }
        .c-orange { color: #ffe0b2; border-color: var(--orange); background: rgba(255, 152, 0, 0.2); }
        .c-yellow { color: #fff9c4; border-color: var(--yellow); background: rgba(255, 235, 59, 0.2); }
        .c-green { color: #c8e6c9; border-color: var(--green); background: rgba(76, 175, 80, 0.2); }

        /* End Game Panel */
        .end-panel { margin-top: 20px; background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; display: none; }
        .end-title { font-size: 1.5rem; font-weight: bold; margin: 0 0 10px 0; }
        .end-price { font-size: 2rem; color: var(--gold); font-weight: bold; margin: 10px 0; }
        .share-btn {
            background: #333; color: white; border: 1px solid #555; border-radius: 6px; padding: 12px 20px; font-size: 1rem; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MAQUINA<span>DLE</span></h1>
        <div class="stats-icons">📅 🏆</div>
    </div>

    <div class="card">
        <div class="card-top">
            <div>
                <div class="brand" id="brand"></div>
                <h2 class="model" id="model"></h2>
                <div class="detail" id="detail"></div>
            </div>
            <div class="year-box">
                <div class="year-label">ANO</div>
                <h3 class="year-val" id="year"></h3>
            </div>
        </div>
        <div class="img-container">
            <img id="image" src="" alt="Veículo de hoje">
        </div>
    </div>

    <div class="guesses" id="guesses-board">
        <!-- As 6 linhas são geradas pelo JavaScript -->
    </div>

    <div class="end-panel" id="end-panel">
        <h2 class="end-title" id="end-title"></h2>
        <p style="color: #888; margin: 0; font-size: 0.9rem;">O valor correto era:</p>
        <div class="end-price" id="end-price"></div>
        <div id="streak-info" style="color: #aaa; margin-bottom: 15px;">🔥 Sequência: <strong id="streak-count" style="color: var(--orange);">0</strong> dias</div>
        <button class="share-btn" onclick="compartilhar()">Compartilhar 🔗</button>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // 1. BANCO DE DADOS (SEU PAINEL DE ADMIN)
    // ---------------------------------------------------------
    const bancoDeDias = [
        { // DIA 1 (17/10/2026)
            brand: "🚜 JOHN DEERE",
            model: "Trator 8320R 4x4",
            detail: "cabinado 7500 horas",
            year: "2018",
            price: 800000,
            image: "dia1.jpg" // Exemplo após você fazer upload
        },
        { // DIA 2 (18/10/2026)
            brand: "🏗️ JCB",
            model: "Retroescavadeira 3CX",
            detail: "cabine aberta 11000 horas",
            year: "2018",
            price: 218000,
            image: "dia2.jpg"
        },
        { // DIA 3 (19/10/2026)
            brand: "🌾 CASE IH",
            model: "Colheitadeira 2388",
            detail: "6040 horas",
            year: "2003",
            price: 405000,
            image: "dia3.jpg"
        }
    ];

    // ---------------------------------------------------------
    // 2. LÓGICA DE DATA
    // ---------------------------------------------------------
    const DATA_LANCAMENTO = new Date('2026-10-17T00:00:00'); 
    
    function getDiaIndex() {
        const hoje = new Date();
        hoje.setHours(0,0,0,0);
        const diasPassados = Math.floor((hoje - DATA_LANCAMENTO) / (1000 * 60 * 60 * 24));
        if (diasPassados < 0) return 0;
        if (diasPassados >= bancoDeDias.length) return bancoDeDias.length - 1; 
        return diasPassados;
    }

    const indexHoje = getDiaIndex();
    const maquinaHoje = bancoDeDias[indexHoje];

    // ---------------------------------------------------------
    // 3. VARIÁVEIS DE JOGO
    // ---------------------------------------------------------
    const MAX_TENTATIVAS = 6;
    let tentativas = [];
    let jogoFinalizado = false;
    let venceu = false;

    document.getElementById('brand').innerText = maquinaHoje.brand;
    document.getElementById('model').innerText = maquinaHoje.model;
    document.getElementById('detail').innerText = maquinaHoje.detail;
    document.getElementById('year').innerText = maquinaHoje.year;
    document.getElementById('image').src = maquinaHoje.image;

    // ---------------------------------------------------------
    // 4. RENDERIZAÇÃO
    // ---------------------------------------------------------
    function renderBoard() {
        const board = document.getElementById('guesses-board');
        board.innerHTML = '';
        
        for (let i = 0; i < MAX_TENTATIVAS; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            
            if (i < tentativas.length) {
                const t = tentativas[i];
                row.innerHTML = `
                    <span class="row-num">${i+1}/6</span>
                    <span class="row-val">R$ ${t.valor.toLocaleString('pt-BR')}</span>
                    <div class="row-hint ${t.cssClass}">${t.icone} ${t.texto}</div>
                `;
            } else if (i === tentativas.length && !jogoFinalizado) {
                row.classList.add('active');
                row.innerHTML = `
                    <span class="row-num">${i+1}/6</span>
                    <div class="input-wrapper">
                        <span class="input-prefix">R$</span>
                        <input type="text" class="guess-input" id="input-palpite" placeholder="0" onkeyup="formatCurrency(this)" inputmode="numeric" autofocus>
                        <button class="submit-btn" onclick="fazerPalpite()">→</button>
                    </div>
                `;
                setTimeout(() => {
                    const input = document.getElementById('input-palpite');
                    if(input) input.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') fazerPalpite();
                    });
                }, 50);
            } else {
                row.innerHTML = `<span class="row-num" style="color: #444;">${i+1}/6</span><span style="color: #444;">—</span>`;
            }
            board.appendChild(row);
        }
    }

    // ---------------------------------------------------------
    // 5. LÓGICA DE PALPITE E FORMATAÇÃO (Ajustado)
    // ---------------------------------------------------------
    function formatCurrency(input) {
        let value = input.value.replace(/\D/g, '');
        if(value === '') { input.value = ''; return; }
        // Remove a divisão por 100 para aceitar apenas inteiros
        input.value = parseInt(value).toLocaleString('pt-BR');
    }

    function fazerPalpite() {
        const inputStr = document.getElementById('input-palpite').value.replace(/\D/g, '');
        if (!inputStr || inputStr === '0') return;
        
        const valorPalpite = parseInt(inputStr); // Agora pega o valor inteiro direto
        const alvo = maquinaHoje.price;
        
        const diffAbsoluta = Math.abs(valorPalpite - alvo);
        const diffPercentual = diffAbsoluta / alvo;
        const direcao = valorPalpite > alvo ? '⏬' : '⏫';
        
        let resultado = {};
        if (diffPercentual <= 0.04) {
            resultado = { cssClass: 'c-green', icone: '✅', texto: 'acertou', emoji: '🟩', win: true };
            venceu = true;
            jogoFinalizado = true;
        } else if (diffPercentual <= 0.15) {
            resultado = { cssClass: 'c-yellow', icone: direcao, texto: valorPalpite > alvo ? 'mais barato' : 'mais caro', emoji: '🟨', win: false };
        } else if (diffPercentual <= 0.25) {
            resultado = { cssClass: 'c-orange', icone: direcao, texto: valorPalpite > alvo ? 'muito mais barato' : 'muito mais caro', emoji: '🟧', win: false };
        } else {
            resultado = { cssClass: 'c-red', icone: direcao, texto: valorPalpite > alvo ? 'absurdamente mais barato' : 'absurdamente mais caro', emoji: '🟥', win: false };
        }

        tentativas.push({ valor: valorPalpite, ...resultado });
        
        if (tentativas.length === MAX_TENTATIVAS && !venceu) {
            jogoFinalizado = true;
        }

        renderBoard();

        if (jogoFinalizado) {
            finalizarDia();
        }
    }

    function finalizarDia() {
        const panel = document.getElementById('end-panel');
        const title = document.getElementById('end-title');
        const price = document.getElementById('end-price');
        
        panel.style.display = 'block';
        price.innerText = `R$ ${maquinaHoje.price.toLocaleString('pt-BR')}`;
        
        if (venceu) {
            title.innerText = "MÁQUINA ARREMATADA!";
            title.style.color = "var(--green)";
        } else {
            title.innerText = "NÃO FOI DESSA VEZ!";
            title.style.color = "var(--red)";
        }

        atualizarStreak();
    }

    function atualizarStreak() {
        let streak = parseInt(localStorage.getItem('maquinadle_streak')) || 0;
        let lastDayPlayed = parseInt(localStorage.getItem('maquinadle_lastDay')) || -1;

        if (lastDayPlayed !== indexHoje) {
            if (venceu) {
                if (lastDayPlayed === indexHoje - 1) { streak += 1; } 
                else { streak = 1; }
            } else {
                streak = 0; 
            }
            localStorage.setItem('maquinadle_streak', streak);
            localStorage.setItem('maquinadle_lastDay', indexHoje);
        }
        
        document.getElementById('streak-count').innerText = streak;
    }

    function compartilhar() {
        let streak = localStorage.getItem('maquinadle_streak') || 0;
        let texto = `Joguei Maquinadle #${indexHoje + 1} ${venceu ? tentativas.length : 'X'}/6 🔥${streak}\n\n`;
        
        tentativas.forEach(t => {
            texto += `${t.icone !== '✅' ? t.icone : ''}${t.emoji}\n`;
        });
        texto += `\nJogue em: maquinadle.com.br`; // Substitua pelo seu .online ou .com.br depois

        navigator.clipboard.writeText(texto).then(() => {
            alert('Copiado para a área de transferência! É só colar no grupo.');
        });
    }

    renderBoard();
</script>

</body>
</html>
